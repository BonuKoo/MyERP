spring:
  application:
    name: myerp
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      # 품목 사진 업로드 한도. 스마트폰 사진 한 장이 보통 3~5MB라 여유를 두고,
      # 요청 전체(여러 장 동시 업로드)는 그 4배까지만 받는다.
      max-file-size: 5MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://localhost:3306/erp_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: erp_user
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 기본값(10)을 그대로 두되 환경변수로 열어둔다 — 풀 크기를 바꿔가며 처리량
      # 곡선을 재는 A2 스윕(k6/LOAD_TEST_PLAN.md)에 필요하다. 값이 실제로 반영됐는지는
      # actuator의 hikaricp.connections.max로 확인할 수 있다(오타 나면 조용히 무시되므로).
      maximum-pool-size: ${DB_POOL_SIZE:10}

server:
  tomcat:
    mbeanregistry:
      # tomcat.threads.* 지표는 이 값이 true여야 등록된다(기본 false).
      # 부하 시 "요청이 스레드 레벨에서 밀리는지"를 보려면 필요하다.
      enabled: true

# 부하 테스트 중 서버 내부 관측용(k6/LOAD_TEST_PLAN.md 3절).
# 노출은 필요한 것만 연다 — env/beans/configprops처럼 설정값이 통째로 드러나는
# 엔드포인트는 열지 않는다. 접근 권한은 SecurityConfig의 anyRequest().authenticated()를
# 그대로 따른다(actuator용 permitAll을 따로 두지 않음).
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.jinbo.myerp.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    com.jinbo.myerp.mapper: DEBUG

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-change-0123456789abcdef}
  expiration-ms: 86400000

# 품목 사진 저장 위치. 리포지토리 바깥이어야 한다 — 업로드물이 git에 섞이면
# 저장소가 무거워지고 브랜치를 옮길 때마다 파일이 사라진다.
file:
  dir: ${FILE_DIR:F:/Project/myerp-uploads/}
